    <div class="card"><h3>Hagel: one realisation and an article</h3><p>Hagel made one realisation of the Hurrian pieces: the MIDI files of h.6 and sixteen fragments on his site <a href="https://www.oeaw.ac.at/kal/mane/" target="_blank" rel="noopener">Music of the Ancient Near East</a>, each marked “Copyright Stefan Hagel 1998” on a page dated 2006. They are dyads in a just tuning, the two highest strings doubled an octave below, with the numerals as durations, h.6 on the D&amp;L text and the fragments on Laroche’s; “by no means intended to represent a reconstruction”, only “an idea of the ‘harmonic’ progression”, since the vocal note “cannot unambiguously be deduced”. The 2005 article says outright that its purpose “is not to put forth another hypothetical rendition” and gives the theory instead: <i>nīd qablim</i> as Dorian read downward; a just tuning on two pure triads (e–g–b, d–f–a) bridged by a pure <i>titur qablītim</i>, with c pure to g, pure to f (as in the files) or tempered between; repetition or duration for the numerals, with 10 a reciting note or a fermata (the files hold it for seven units), the distribution of the numbers counting against duration; and, for the fragments, <i>ašḫuwe</i> as f raised to f♯, which the files do not use. The Hagel preset plays the files; the article’s alternatives are settings: Fine tuning, The numeral counts, and the qualifier option in Appendix B.</p></div>
    <div class="card"><h3>Koitabashi 1996/1998: formulas and counts</h3><p>Koitabashi lists six problems (what the terms denote, what the numerals count, <i>uštamari</i>, whether the repeated syllables are refrains, the two pairs of small wedges on the double ruling, and how the words fit the notes) and answers four. The wedges are not peculiar to h.6: Laroche (1968: 462 n. 3) describes a double oblique wedge marking the double ruling at its start, and sometimes along it, also on h.3, h.10, h.20, h.23 and h.28. Each term is a melodic formula known by its first and final note, as the Hebrew accents call up stock formulas; the numeral is the number of repetitions; one formula may go to each word; the repeated syllables are a reading aid, like the custos (<i>guidon</i>) of chant. The Koitabashi preset takes the first two answers and fills each formula by step, which he does not specify.</p></div>
    <div class="card"><h3>Not modelled here</h3><p><b>Güterbock 1970</b> identified the terms and tested both counts against the syllables without result. <b>Thiel 1977–78</b> studied text and structure without a transcription. <b>Halperin 1992</b> and <b>Rahn 2011</b> analyse tuning and the whole corpus rather than proposing a single score.</p></div>
    <div class="card"><h3>Versions beyond the score</h3><p>Kilmer’s performing version (<i>Sounds from Silence</i>, 1976) and Krispijn’s three verses depend on fitting the text. Dumbrill’s maqām version, first sung at the Damascus Opera House in 2011 and recorded at Byblos in 2012, came from musicians who “felt the need to emphasize certain pitches” and spoke of <i>bayātī</i> and <i>ḥijāz</i> (Dumbrill 2014, 334). His printed 2014 score, entered here, is plain diatonic; the inflections belong to the performance, and nothing in the notation or the tuning texts specifies them.</p></div>
    <div class="card"><h3>Critiques</h3><p><b>Bayer 2014</b>: each proponent “brought to the task his own current theory-of-Mesopotamian-music”, and the problem is not solved. <b>Gibson 2026</b> argues that staff notation itself closes the question, and proposes string-number tablature as the neutral layer: here, the tiles.</p></div>`;
}

function DICHclsOf(a, b) { const d = Math.min(Math.abs(a - b), 7 - Math.abs(a - b)); return d === 3 ? 'p' : d === 2 ? 's' : 'n'; }
const seg = (x, y) => { const r = [], st = x < y ? 1 : -1; for (let i = x; i !== y + st; i += st) r.push(i); return r; };
function runPath(a, b, cls, cfg) {
  const dirSign = cfg.dir === 'desc' ? -1 : 1; // pitch movement for +1 string index
  const pd = (x, y) => Math.sign((y - x) * dirSign);
  if (cfg.path === 'dumbrill') { // primaries: five strings from the first, falling; secondaries: the three-string span, rising
    if (cls === 'p') return dirSign < 0 ? seg(a, a + 4) : seg(a, a - 4 > 0 ? a - 4 : a + 4);
    let [x, y] = [a, b]; if (Math.abs(x - y) > 2) { if (x <= 2) x += 7; else y += 7; }
    const lo = Math.min(x, y), hi = Math.max(x, y);
    return dirSign < 0 ? seg(hi, lo) : seg(lo, hi);
  }
  if (cfg.path === 'wulstan') { // Wulstan 1971: primaries rise through the fifth from its lower note, secondaries fall through the third from its upper note
    const span = cls === 'p' ? 4 : 2; let lo = Math.min(a, b), hi = Math.max(a, b);
    if (hi - lo !== span) { lo = hi; hi = Math.min(a, b) + 7; }
    const up = dirSign > 0 ? seg(lo, hi) : seg(hi, lo);
    return cls === 'p' ? up : up.slice().reverse();
  }
  const cands = [[a, b]];
  if (cfg.use89) { if (b <= 2) cands.push([a, b + 7]); if (a <= 2) cands.push([a + 7, b]); }
  let pick = [a, b];
  if (cfg.path === 'down') { const c = cands.find(([x, y]) => pd(x, y) === -1); if (c) pick = c; }
  return seg(pick[0], pick[1]);
}

const SINGLE = { 'ḫa-ap-še-ma': 5, 'ḫapšema': 5, 'e-ta-ma-še-a-ni': 4, 'etamašeani': 4 };

}

/* realize a list of lines; opt.h6 enables Vitale's h.6-specific frame */
function realizeLines(cfgIn, lines, opt = {}) {

  let prevLi = null, sounded = false;

    if (!opt.h6 && cfg.lineGap && prevLi != null && u.li !== prevLi && sounded) { const k = opt.lineNums ? Math.max(1, opt.lineNums[u.li] - opt.lineNums[prevLi]) : 1; push(cfg.lineGap * U * k, [], 'rest', u.idx); }

    if (u.k === '|') { marks.push({ t, label: '…', kind: 'gap' }); if (!cfg.lineGap) push(1, [], 'rest', u.idx); else if (u.tl !== 'gap-lines' && sounded) push(cfg.lineGap * U, [], 'rest', u.idx); u.end = t; continue; }
    if ((u.k === '@' || u.k === '@u') && cfg.ustRest && /u[šs]-?ta/.test(u.tl)) { marks.push({ t, label: '[uštamari]', kind: 'word' }); push(cfg.ustRest, [], 'rest', u.idx); u.end = t; continue; }

    } else if (cfg.mode === 'upper' || cfg.mode === 'second') {
      const mel = cfg.mode === 'upper' ? upperOf(a, b, cfg) : (cfg.qual === 'west' && u.qual === 'down' ? a : b); // West: “lower” moves the tune to the first string
      const low = (cfg.use89 && mel <= 2) ? mel + 7 : null; // West: 1, 2 sound with 8, 9; the low note carries the voice

        if (cfg.tenRest && n >= 10) { for (const s of path) push(U, [s], 'note', u.idx, qx); push(2, [], 'rest', u.idx); }
        else { const p = path.slice(); const st = p.length > 1 ? Math.sign(p[p.length - 1] - p[p.length - 2]) : 1; while (p.length < n) p.push(p[p.length - 1] + st); for (const s of p.slice(0, Math.max(1, n))) push(U, [s], 'note', u.idx, qx); }
      } else if (cfg.num === 'embellish') {
        for (const s of path) push(U, [s], 'note', u.idx, qx);
        const L = path.length, nEmb = u.num.v == null ? 0 : n;
        for (let e = 0; e < nEmb; e++) push(cfg.embDur || U, [path[e % 2 === 0 ? L - 2 : L - 1]], 'emb', u.idx, qx);
      } else if (cfg.num === 'hold') {
        path.forEach((s, i) => push(i === path.length - 1 ? (u.num.v == null ? U : n) : U, [s], 'note', u.idx, qx));

        const sung = !opt.h6 || !(u.li === 5 || (u.li === 0 && u.si < 4));

        if (opt.h6 && cfg.vitale && u.li === 0 && n === 10) { bars(5, 2); marks.push({ t, label: '人声进入', kind: 'voice' }); bars(5, 3); }

  return { cfg, units: us, events: ev, marks, total: t, lineSpans, onsets, notes, uses89: maxS > 7, maxS };

/* The tab strip scrolls sideways when it does not fit: arrows and faded edges show which way there is more. */
const TABSTRIP = (() => {
  const bar = document.querySelector('.tabbar'), nav = bar.querySelector('.tabs');
  const prev = bar.querySelector('.tabs-arrow.prev'), next = bar.querySelector('.tabs-arrow.next');
  const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  function update() {
    const max = nav.scrollWidth - nav.clientWidth, l = nav.scrollLeft > 2, r = nav.scrollLeft < max - 2;
    bar.classList.toggle('more-l', l); bar.classList.toggle('more-r', r); prev.hidden = !l; next.hidden = !r;
  }
  function step(d) { nav.scrollBy({ left: d * Math.max(160, nav.clientWidth * 0.6), behavior: smooth() }); }
  function reveal(tab) {
    if (!tab) return;
    const pad = 44, a = tab.offsetLeft - pad, b = tab.offsetLeft + tab.offsetWidth + pad - nav.clientWidth;
    if (nav.scrollLeft > a) nav.scrollTo({ left: Math.max(0, a), behavior: 'auto' });

  }
  prev.onclick = () => step(-1); next.onclick = () => step(1);
  nav.addEventListener('scroll', update, { passive: true });
  addEventListener('resize', update);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);

})();

function renderNotModelled() {
  $('#notModelled').innerHTML = `
    <div class="card"><h3>Hagel：一个演绎版本和一篇文章</h3><p>Hagel 只做过一个胡里歌曲的演绎版本：他网站 <a href="https://www.oeaw.ac.at/kal/mane/" target="_blank" rel="noopener">Music of the Ancient Near East</a> 上 h.6 和十六块残片的 MIDI 文件，每个文件都标有“Copyright Stefan Hagel 1998”，所在网页标注 2006 年。它们是纯律中的二音和弦，最高的两根弦在低八度重叠，数字作为时值；h.6 用 D&amp;L 的文本，残片用 Laroche 的文本。他说这些“by no means intended to represent a reconstruction”（绝非意在代表一种重构），只是“an idea of the ‘harmonic’ progression”（对“和声”进行的一点概念），因为人声的音“cannot unambiguously be deduced”（无法明确推出）。2005 年的文章明说其目的“is not to put forth another hypothetical rendition”（不是再提出一种假设性的演奏版本），给出的是理论：<i>nīd qablim</i> 往下读是多利亚；一种建立在两个纯律三和弦（e–g–b、d–f–a）上的纯律调弦，由一个纯律的 <i>titur qablītim</i> 相连，c 或与 g 成纯律，或与 f 成纯律（他的文件即如此），或取两者之间；数字是重复还是时值，10 是吟诵音还是延长记号（他的文件把它延长七个单位），并认为数字的分布不利于时值说；在残片中，<i>ašḫuwe</i> 表示把 f 升为 f♯，而他的文件没有这样处理。Hagel 预设演奏的是他的文件；文章提出的其他方案都放在设置里：“细调”“数字表示”，以及附录 B 中的修饰词选项。</p></div>
    <div class="card"><h3>Koitabashi 1996/1998：旋律型与次数</h3><p>Koitabashi（小板橋又久）列出六个难题（术语指什么、数字表示什么、<i>uštamari</i> 是什么意思、重复的音节是不是叠句、双线上那两对小楔形是什么、歌词怎样配到音上），并回答了其中四个。这些小楔形并非 h.6 独有：Laroche（1968：462 注 3）说，双线开头处（有时中途也有）标着一个双重的斜楔，h.3、h.10、h.20、h.23 和 h.28 上也都有。每个术语是一个旋律型，以它的起音和终音来标识，就像希伯来圣经的诵读重音符号（teʿamim）唤起固定的旋律型一样；数字是重复的次数；或许一个词配一个旋律型；重复的音节是帮助阅读的记号，类似圣咏记谱中的导音符（custos，<i>guidon</i>）。“Koitabashi”预设采用前两个回答，并以级进填满每个旋律型——这一点他并未说明。</p></div>
    <div class="card"><h3>本页未建模的</h3><p><b>Güterbock 1970</b> 辨认出这些术语，并用两种计数法去配音节，都没有结果。<b>Thiel 1977–78</b> 研究了文本和结构，但没有转谱。<b>Halperin 1992</b> 和 <b>Rahn 2011</b> 分析的是调律和全部材料，而不是提出某一份乐谱。</p></div>
    <div class="card"><h3>乐谱之外的版本</h3><p>Kilmer 的演奏版（<i>Sounds from Silence</i>，1976）和 Krispijn 的三段歌词，都依赖于如何配词。Dumbrill 的 maqām 版本，2011 年在大马士革歌剧院首演，2012 年在比布鲁斯录音，出自那些“felt the need to emphasize certain pitches”（觉得需要强调某些音）、谈到 <i>bayātī</i> 和 <i>ḥijāz</i> 的乐手（Dumbrill 2014，334）。本页录入的是他 2014 年印出的乐谱，是纯粹的自然音阶；那些音高变化属于演出，记谱和调弦文献中都没有依据。</p></div>
    <div class="card"><h3>批评</h3><p><b>Bayer 2014</b>：每位提出者都“brought to the task his own current theory-of-Mesopotamian-music”（带着自己当时的美索不达米亚音乐理论来做这件事），问题并没有解决。<b>Gibson 2026</b> 认为五线谱本身就把问题提前定死了，主张用弦号谱作为中立的一层：也就是本页的方块。</p></div>`;
}

addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^[1-9]$/.test(ev.key)) { pluckString(+ev.key); ev.preventDefault(); }
  else if (ev.key === ' ' && (ev.target === document.body) && S.tab === 'score') { ev.preventDefault(); $('#playBtn').click(); }
});

/* ---------------- boot ---------------- */
$('#soundBtn').textContent = S.sound ? '声音：开' : '声音：关'; $('#soundBtn').setAttribute('aria-pressed', String(S.sound));
recompute(); buildLyre(); renderBench();
showTab(location.hash.slice(1) || 'score');
})();

</script>
<script>
(function () {
  var L = window.H6_LANG === 'zh' ? 'zh' : 'en';
  var tpl = document.getElementById('L-' + L);
  tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl);
  ['L-en', 'L-zh'].forEach(function (id) { var t = document.getElementById(id); t.parentNode.removeChild(t); });
  Array.prototype.forEach.call(document.querySelectorAll('.langsw button'), function (b) {
    var on = b.getAttribute('data-lang') === L;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', function () {
      if (on) return;
      var to = b.getAttribute('data-lang');
      try { localStorage.setItem('h6-lang', to); } catch (e) {}
      var u = location.href.replace(/#.*$/, ''), h = location.hash;
      u = /[?&]lang=/.test(u) ? u.replace(/([?&]lang=)[^&]*/, '$1' + to) : u + (u.indexOf('?') < 0 ? '?' : '&') + 'lang=' + to;
      location.replace(u + h);
    });
  });
  (L === "zh" ? ['J-zh-engine', 'J-appx', 'J-lar', 'J-zh-data', 'J-zh-ui'] : ['J-en-engine', 'J-appx', 'J-lar', 'J-en-ui']).forEach(function (id) {
    var s = document.createElement('script');
    s.text = document.getElementById(id).textContent;
    document.body.appendChild(s);
  });
})();
</script>
</body>
